          request_type\")\n\n\ndef main(form_json=None, saved=None):\n    try:\n \
          \       data = json.loads(form_json) if form_json else {}\n    except Exception:\n\
          \        data = {}\n    if not isinstance(data, dict):\n        data = {}\n\
          \    try:\n        stored = json.loads(saved) if saved else {}\n    except\
          \ Exception:\n        stored = {}\n    if not isinstance(stored, dict):\n\
          \        stored = {}\n\n    def as_text(key):\n        value = data.get(key)\n\
          \        text = \"\" if value is None else str(value).strip()\n        if\
          \ not text:\n            fallback = stored.get(key)\n            text =\
          \ \"\" if fallback is None else str(fallback).strip()\n        return text\n\
          \n    fields = {k: as_text(k) for k in FIELDS}\n    query = \" \".join(\n\
          \        [fields[k] for k in (\"issue\", \"purpose\", \"constraints\", \"\
          request_type\") if fields[k]]\n    )\n\n    return {\n        \"issue\"\
