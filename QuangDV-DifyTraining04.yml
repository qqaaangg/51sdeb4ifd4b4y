    - data:
        code: "import json\nimport re\n\nSECTIONS = (\"current_state\", \"problem\"\
          , \"solution\", \"effect\")\nLABELS = {\n    \"current_state\": \"Current\
          \ state\",\n    \"problem\": \"Problem\",\n    \"solution\": \"Solution\"\
          ,\n    \"effect\": \"Effect\",\n}\n\n\ndef main(raw: str, plans_json: dict,\
          \ plan_id: str):\n    text = str(raw) if raw else \"\"\n    data = {}\n\
          \    match = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    if match:\n    \
          \    try:\n            candidate = json.loads(match.group(0))\n        \
          \    if isinstance(candidate, dict):\n                data = candidate\n\
          \        except Exception:\n            data = {}\n\n    def text_of(key):\n\
          \        value = data.get(key)\n        return \"\" if value is None else\
          \ str(value).strip()\n\n    selected = str(plan_id or data.get(\"plan_id\"\
          ) or \"A\").strip().upper()[:1]\n\n    try:\n        plans = json.loads(plans_json)\
          \ if plans_json else []\n    except Exception:\n        plans = []\n   \
          \ if not isinstance(plans, list):\n        plans = []\n\n    current = {}\n\
          \    others = []\n    for plan in plans:\n        if not isinstance(plan,\
          \ dict):\n            continue\n        if str(plan.get(\"id\") or \"\"\
          ).upper() == selected:\n            current = plan\n        else:\n    \
          \        others.append({\n                \"id\": str(plan.get(\"id\") or\
          \ \"\"),\n                \"tier\": str(plan.get(\"tier\") or \"\"),\n \
          \               \"title\": str(plan.get(\"title\") or \"\"),\n         \
          \   })\n\n    story = []\n    total = 0\n    for key in SECTIONS:\n    \
          \    body = text_of(key)\n        total += len(body)\n        story.append({\"\
          key\": key, \"label\": LABELS[key], \"body\": body})\n\n    main_message\
          \ = \" \".join(text_of(\"main_message\").split())\n    warnings = []\n \
          \   if len(main_message) > 60:\n        warnings.append(\"Main message is\
          \ %d characters (limit 60)\" % len(main_message))\n    if total < 500 or\
          \ total > 1200:\n        warnings.append(\"Proposal body is %d characters\
          \ (expected 500-1200)\" % total)\n    for section in story:\n        if\
          \ not section[\"body\"]:\n            warnings.append(\"Section '%s' is\
          \ empty\" % section[\"label\"])\n\n    payload = {\n        \"plan_id\"\
          : selected,\n        \"plan_title\": text_of(\"plan_title\") or str(current.get(\"\
          title\") or \"\"),\n        \"main_message\": main_message,\n    }\n   \
          \ for section in story:\n        payload[section[\"key\"]] = section[\"\
          body\"]\n\n    return {\n        \"plan_id\": selected,\n        \"plan_title\"\
          : payload[\"plan_title\"],\n        \"plan_tier\": str(current.get(\"tier\"\
          ) or \"\"),\n        \"quality\": str(current.get(\"quality\") or \"\"),\n\
          \        \"cost\": str(current.get(\"cost\") or \"\"),\n        \"delivery\"\
          : str(current.get(\"delivery\") or \"\"),\n        \"main_message\": main_message,\n\
          \        \"main_message_len\": len(main_message),\n        \"story\": story,\n\
          \        \"total_chars\": total,\n        \"warnings\": warnings,\n    \
          \    \"other_plans\": others,\n        \"story_json\": json.dumps(payload,\
          \ ensure_ascii=False),\n    }\n"
