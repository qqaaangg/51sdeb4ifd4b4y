            \ Task\nProduce EXACTLY three proposal patterns, differentiated mainly\
            \ by cost and quality:\n- id \"A\", tier \"Premium\" - high cost / high\
            \ quality\n- id \"B\", tier \"Standard\" - medium cost / standard quality\n\
            - id \"C\", tier \"Basic\" - low cost / minimum viable quality\n\nFor\
            \ every plan write:\n- title: a short concrete name for the plan (max\
            \ 40 characters)\n- rationale: WHY this plan fits THIS issue and purpose.\
            \ 80-200 characters.\n- content: what is actually delivered - scope, main\
            \ activities, deliverables. 150-300 characters.\n- quality: the Q of QCD\
            \ - what level of quality and how it is assured. 40-120 characters.\n\
            - cost: the C of QCD - relative cost level and the main cost drivers.\
            \ 40-120 characters.\n- delivery: the D of QCD - lead time / phasing /\
            \ milestones. 40-120 characters.\n- based_on: array of the exact titles\
            \ of the Step 2 cases this plan draws on. Empty array if none.\n\n# Rules\n\
            - The three plans MUST be genuinely different in scope, not the same plan\
            \ reworded. A must clearly cost more and deliver more than B, and B more\
            \ than C.\n- Every plan MUST fill quality, cost and delivery. Never leave\
            \ a QCD field empty.\n- Stay consistent with Step 1 and Step 2. Do not\
            \ contradict the stated constraints. If a constraint (budget, deadline)\
            \ rules a tier out, say so explicitly inside rationale instead of ignoring\
            \ it.\n- If the Step 2 case list is empty, still produce three plans,\
            \ base them only on the requirements, and leave based_on empty. Do NOT\
            \ invent case titles.\n- Write in the same language as the requirements.\n\
            - Return raw JSON only. No markdown fences, no commentary.\n\n# Output\
            \ JSON schema\n{\n  \"plans\": [\n    {\"id\": \"A\", \"tier\": \"Premium\"\
            , \"title\": \"string\", \"rationale\": \"string\",\n      \"content\"\
            : \"string\", \"quality\": \"string\", \"cost\": \"string\",\n      \"\
            delivery\": \"string\", \"based_on\": [\"string\"]}\n  ]\n}"
