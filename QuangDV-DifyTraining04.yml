    - data:
        code: "import json\nimport re\n\nTIERS = [(\"A\", \"Premium\", \"High cost\
          \ / high quality\"),\n         (\"B\", \"Standard\", \"Medium cost / standard\
          \ quality\"),\n         (\"C\", \"Basic\", \"Low cost / minimum quality\"\
          )]\n\n\ndef main(raw=None):\n    text = str(raw) if raw else \"\"\n    parsed\
          \ = {}\n    match = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    if match:\n\
          \        try:\n            candidate = json.loads(match.group(0))\n    \
          \        if isinstance(candidate, dict):\n                parsed = candidate\n\
          \        except Exception:\n            parsed = {}\n\n    by_id = {}\n\
          \    items = parsed.get(\"plans\")\n    if isinstance(items, list):\n  \
          \      for item in items:\n            if isinstance(item, dict):\n    \
          \            pid = str(item.get(\"id\") or \"\").strip().upper()[:1]\n \
          \               if pid in (\"A\", \"B\", \"C\") and pid not in by_id:\n\
          \                    by_id[pid] = item\n\n    def text_of(item, key):\n\
          \        value = item.get(key)\n        return \"\" if value is None else\
          \ str(value).strip()\n\n    plans = []\n    issues = []\n    for pid, tier,\
          \ label in TIERS:\n        item = by_id.get(pid, {})\n        plan = {\n\
          \            \"id\": pid,\n            \"tier\": text_of(item, \"tier\"\
          ) or tier,\n            \"label\": label,\n            \"title\": text_of(item,\
          \ \"title\") or (tier + \" plan\"),\n            \"rationale\": text_of(item,\
          \ \"rationale\"),\n            \"content\": text_of(item, \"content\"),\n\
          \            \"quality\": text_of(item, \"quality\"),\n            \"cost\"\
          : text_of(item, \"cost\"),\n            \"delivery\": text_of(item, \"delivery\"\
          ),\n        }\n        based = item.get(\"based_on\")\n        if isinstance(based,\
          \ list):\n            plan[\"based_on\"] = [str(x).strip() for x in based\
          \ if str(x).strip()]\n        else:\n            plan[\"based_on\"] = []\n\
          \        for key in (\"quality\", \"cost\", \"delivery\"):\n           \
          \ if not plan[key]:\n                issues.append(\"Plan %s is missing\
          \ the %s part of QCD\" % (pid, key.upper()[:1]))\n        if not plan[\"\
          rationale\"]:\n            issues.append(\"Plan %s has no rationale\" %\
          \ pid)\n        plans.append(plan)\n\n    return {\n        \"plans\": plans,\n\
          \        \"plans_json\": json.dumps(plans, ensure_ascii=False),\n      \
          \  \"count\": len(plans),\n        \"qcd_issues\": issues,\n        \"qcd_ok\"\
          : 0 if issues else 1,\n    }\n"
