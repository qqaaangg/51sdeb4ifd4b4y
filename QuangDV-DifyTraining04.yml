            \ patterns.\n\n# Approved requirements (Step 1)\n- Issue: {{#1785448333692.issue#}}\n\
            - Purpose: {{#1785448333692.purpose#}}\n- Constraints: {{#1785448333692.constraints#}}\n\
            - Request type: {{#1785448333692.request_type#}}\n\n# Similar cases found\
