    - data:
        desc: Render the verification form
        selected: false
        template: "{% set types = ['Operational improvement', 'Safety-focused', 'Eco-friendly',\
          \ 'Innovation-focused', 'Customer-satisfaction-focused', 'Regulatory-compliance',\
          \ 'Scalability-focused', 'Data-driven', 'AI-utilization'] %}\n{% set has_content\
          \ = problem or goal or constraints or request_type %}\n<div style=\"font-family:system-ui,-apple-system,Segoe\
          \ UI,sans-serif;max-width:760px;border:1px solid #dcdcdc;border-radius:10px;padding:24px;color:#1f1f1f\"\
          >\n{% if ok == 0 or not has_content %}\n  <h2 style=\"margin:0 0 8px;font-size:18px;font-weight:500\"\
          >Could not read the inquiry</h2>\n  <p style=\"margin:0 0 16px;font-size:14px;line-height:1.6;color:#555\"\
          >The submitted content could not be interpreted as an internal inquiry. Please\
          \ paste the inquiry text again, or upload the meeting minutes / call log\
          \ as a document, then run once more.</p>\n  <details style=\"font-size:12px;color:#777\"\
          ><summary style=\"cursor:pointer\">Raw model output</summary><pre style=\"\
          white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:6px\"\
          >{{ raw }}</pre></details>\n{% else %}\n  <h2 style=\"margin:0 0 4px;font-size:18px;font-weight:500\"\
          >Step 1 &mdash; Requirement verification</h2>\n  <p style=\"margin:0 0 20px;font-size:13px;color:#666\"\
          >Review the extracted requirements, correct anything that is wrong, then\
          \ press Verify.</p>\n\n  <div style=\"margin-bottom:20px;padding:10px 14px;background:{%\
          \ if confidence >= 70 %}#eaf5ea{% elif confidence >= 40 %}#fdf4e3{% else\
          \ %}#fbeaea{% endif %};border-radius:6px;font-size:13px\">\n    Extraction\
          \ confidence: <strong>{{ confidence }}%</strong>\n    {% if needs_followup\
          \ == 1 %}&nbsp;&middot;&nbsp;additional information required{% endif %}\n\
          \  </div>\n\n  <form id=\"step1-verify\" method=\"post\" data-step=\"1\"\
          >\n    {% for field in [['problem', 'Problem', problem], ['goal', 'Goal',\
          \ goal], ['constraints', 'Constraints', constraints]] %}\n    <label style=\"\
          display:block;margin-bottom:6px;font-size:13px;font-weight:500\">{{ field[1]\
          \ }}{% if field[0] in missing_fields %} <span style=\"color:#b3261e;font-weight:400\"\
          >(needs confirmation)</span>{% endif %}</label>\n    <textarea name=\"{{\
          \ field[0] }}\" rows=\"3\" style=\"width:100%;box-sizing:border-box;margin-bottom:18px;padding:10px;font:inherit;font-size:14px;border:1px\
          \ solid #ccc;border-radius:6px\">{{ field[2] }}</textarea>\n    {% endfor\
          \ %}\n\n    <label style=\"display:block;margin-bottom:6px;font-size:13px;font-weight:500\"\
          >Request type</label>\n    <select name=\"request_type\" style=\"width:100%;box-sizing:border-box;margin-bottom:18px;padding:10px;font:inherit;font-size:14px;border:1px\
          \ solid #ccc;border-radius:6px\">\n      <option value=\"\">-- select --</option>\n\
          \      {% for option in types %}<option value=\"{{ option }}\"{% if option\
          \ == request_type %} selected{% endif %}>{{ option }}</option>{% endfor %}\n\
          \    </select>\n\n    {% if followup_questions %}\n    <div style=\"margin-bottom:8px;padding:14px;background:#f6f6f6;border-radius:6px\"\
          >\n      <div style=\"font-size:13px;font-weight:500;margin-bottom:8px\"\
          >Please answer to complete the requirements</div>\n      <ul style=\"margin:0;padding-left:20px;font-size:13px;line-height:1.7;color:#444\"\
          >\n        {% for question in followup_questions %}<li>{{ question }}</li>{%\
          \ endfor %}\n      </ul>\n    </div>\n    {% endif %}\n\n    <label style=\"\
          display:block;margin:18px 0 6px;font-size:13px;font-weight:500\">Additional\
          \ information{% if needs_followup == 0 %} (optional){% endif %}</label>\n\
          \    <textarea name=\"supplement\" rows=\"3\" placeholder=\"Add anything\
          \ missing, or leave blank if the above is complete.\" style=\"width:100%;box-sizing:border-box;margin-bottom:20px;padding:10px;font:inherit;font-size:14px;border:1px\
          \ solid #ccc;border-radius:6px\"></textarea>\n\n    <button type=\"submit\"\
          \ name=\"action\" value=\"verify\" style=\"padding:11px 26px;font:inherit;font-size:14px;font-weight:500;color:#fff;background:#1a73e8;border:0;border-radius:6px;cursor:pointer\"\
          >Verify</button>\n  </form>\n{% endif %}\n</div>"
        title: Render HTML Form
