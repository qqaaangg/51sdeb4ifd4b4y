    - data:
        code: "import json\nimport re\n\n\ndef main(raw=None):\n    text = str(raw)\
          \ if raw else \"\"\n    data = {}\n\n    match = re.search(r\"\\{[\\s\\\
          S]*\\}\", text)\n    if match:\n        parsed = json.loads(match.group(0))\n\
          \        if isinstance(parsed, dict):\n            data = parsed\n\n   \
          \ def as_text(key):\n        value = data.get(key)\n        return \"\"\
          \ if value is None else str(value).strip()\n\n    def as_list(key):\n  \
          \      value = data.get(key)\n        if value is None:\n            return\
          \ []\n        if isinstance(value, list):\n            return [str(x).strip()\
          \ for x in value if x is not None]\n        return [str(value).strip()]\n\
          \n    try:\n        confidence = int(float(data.get(\"confidence\") or 0))\n\
          \    except Exception:\n        confidence = 0\n    confidence = max(0,\
          \ min(100, confidence))\n\n    missing = as_list(\"missing_fields\")\n \
          \   raw_followup = data.get(\"needs_followup\")\n    needs_followup = 1\
          \ if raw_followup in (True, 1, \"true\", \"True\", \"1\") else 0\n    if\
          \ missing:\n        needs_followup = 1\n\n    return {\n        \"issue\"\
          : as_text(\"issue\"),\n        \"purpose\": as_text(\"purpose\"),\n    \
          \    \"constraints\": as_text(\"constraints\"),\n        \"request_type\"\
          : as_text(\"request_type\"),\n        \"confidence\": confidence,\n    \
          \    \"missing_fields\": missing,\n        \"followup_questions\": as_list(\"\
          followup_questions\"),\n        \"needs_followup\": needs_followup,\n  \
          \      \"raw\": text\n    }"
