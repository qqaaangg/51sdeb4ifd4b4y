          \ if raw else \"\"\n    cases = []\n    found = 0\n\n    match = re.search(r\"\
          \\{[\\s\\S]*\\}\", text)\n    if match:\n        try:\n            data\
          \ = json.loads(match.group(0))\n        except Exception:\n            data\
          \ = {}\n        if isinstance(data, dict):\n            items = data.get(\"\
          cases\")\n            if isinstance(items, list):\n                for item\
          \ in items[:5]:\n                    if not isinstance(item, dict):\n  \
          \                      continue\n                    title = str(item.get(\"\
          title\") or \"\").strip()\n                    summary = str(item.get(\"\
          summary\") or \"\").strip()\n                    if title or summary:\n\
          \                        cases.append({\n                            \"\
          title\": title or \"Untitled\",\n                            \"summary\"\
          : summary\n                        })\n\n    if cases:\n        found =\
          \ 1\n\n    return {\n        \"cases\": cases,\n        \"count\": len(cases),\n\
          \        \"found\": found,\n        \"raw\": text\n    }"
