    - data:
        code: "import json\nimport re\n\n\ndef main(raw=None, saved=None):\n    def\
          \ load(value):\n        text = str(value) if value else \"\"\n        match\
          \ = re.search(r\"\\{[\\s\\S]*\\}\", text)\n        if not match:\n     \
          \       return {}\n        try:\n            parsed = json.loads(match.group(0))\n\
          \            return parsed if isinstance(parsed, dict) else {}\n       \
          \ except Exception:\n            return {}\n\n    data = load(raw)\n   \
          \ stored = load(saved)\n\n    def as_text(key):\n        value = data.get(key)\n\
          \        text = \"\" if value is None else str(value).strip()\n        if\
          \ not text:\n            fallback = stored.get(key)\n            text =\
          \ \"\" if fallback is None else str(fallback).strip()\n        return text\n\
          \n    def as_list(key):\n        value = data.get(key)\n        if value\
          \ is None:\n            return []\n        if isinstance(value, list):\n\
          \            return [str(x).strip() for x in value if x is not None]\n \
          \       return [str(value).strip()]\n\n    try:\n        confidence = int(float(data.get(\"\
          confidence\") or 0))\n    except Exception:\n        confidence = 0\n  \
          \  confidence = max(0, min(100, confidence))\n\n    missing = as_list(\"\
          missing_fields\")\n    flag = data.get(\"needs_followup\")\n    needs_followup\
          \ = 1 if flag in (True, 1, \"true\", \"True\", \"1\") else 0\n    if missing:\n\
          \        needs_followup = 1\n\n    fields = {\n        \"issue\": as_text(\"\
          issue\"),\n        \"purpose\": as_text(\"purpose\"),\n        \"constraints\"\
          : as_text(\"constraints\"),\n        \"request_type\": as_text(\"request_type\"\
          )\n    }\n\n    missing = [m for m in missing if not fields.get(m)]\n  \
          \  if not missing:\n        needs_followup = 0\n\n    return {\n       \
          \ \"issue\": fields[\"issue\"],\n        \"purpose\": fields[\"purpose\"\
          ],\n        \"constraints\": fields[\"constraints\"],\n        \"request_type\"\
          : fields[\"request_type\"],\n        \"confidence\": confidence,\n     \
          \   \"missing_fields\": missing,\n        \"followup_questions\": as_list(\"\
          followup_questions\"),\n        \"needs_followup\": needs_followup,\n  \
          \      \"requirements_json\": json.dumps(fields, ensure_ascii=False),\n\
          \        \"raw\": str(raw) if raw else \"\"\n    }"
        code_language: python3
